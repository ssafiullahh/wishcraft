services:
  wishcraft:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL_DOCKER:-http://ollama:11434}
      WISHCRAFT_DB_PATH: /data/wishcraft.sqlite3
    volumes:
      - wishcraft_data:/data
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
volumes:
  ollama_data:
  wishcraft_data:
